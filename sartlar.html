.update-date{font-size:11px;color:var(--gri);margin-top:24px;padding-top:16px;border-top:1px solid var(--border);}

nav{background:linear-gradient(90deg,#050905,#111a11);border-bottom:3px solid var(--sari);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:999;flex-wrap:wrap;}

.logo span{color:#fff;}
.nav-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.nav-links a{color:var(--gri);text-decoration:none;font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px;transition:.2s;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;}
.nav-links a:hover{color:#fff;background:rgba(245,197,24,.2);}
.nav-links a.aktif{color:var(--sari);background:rgba(245,197,24,.15);}
.nav-admin{border:1px solid rgba(245,197,24,.4)!important;color:var(--sari)!important;}
.nav-toggle{display:none;background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:16px;}

  .nav-toggle{display:block;}

  .nav-links.acik{display:flex;}
  .nav-links a{width:100%;padding:10px 20px;border-radius:0;}
  nav{flex-wrap:wrap;height:auto;padding:10px 20px;}
